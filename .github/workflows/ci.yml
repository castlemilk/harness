name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Workspace packages are consumed through their `dist/` (and the Prisma
      # client is generated by the db build), so everything the typed lint rules
      # import must exist before `pnpm lint`. The bundle is excluded: its build
      # materializes a server install and is not needed for lint/tests.
      - run: pnpm --filter @omega-harness/usecase-kit build
      - run: pnpm -r --filter '!@castlemilk/omega' build
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm test
